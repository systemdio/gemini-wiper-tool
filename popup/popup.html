<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Gemini Wiper</title><link rel="stylesheet" href="popup.css"/></head><body>
<div class="app">
  <header><img src="../icons/icon48.png" class="logo"/><div class="header-text"><h1>Gemini Wiper</h1><p>Bulk delete for Gemini</p></div><button id="btn-settings" class="icon-btn" title="Settings">⚙</button></header>
  <div id="wrong-page" class="view hidden"><p class="info-msg">Open <strong>gemini.google.com</strong> to use this extension.</p><button id="btn-go" class="btn btn-primary">Open Gemini ↗</button></div>
  <div id="main" class="view hidden">
    <div class="tabs"><button class="tab active" data-tab="conv">💬 Chats</button><button class="tab" data-tab="lib">📚 Library</button></div>
    <div id="settings-panel" class="settings hidden">
      <label class="setting-row"><span>Speed</span><select id="sel-speed"><option value="0.6">⚡ Fast</option><option value="1" selected>⏱ Balanced</option><option value="1.6">🐢 Safe</option></select></label>
      <label class="setting-row"><span>Delay</span><input id="rng-delay" type="range" min="50" max="400" value="150" step="10"><span id="lbl-delay">150ms</span></label>
      <p class="setting-hint">Faster = less reliable on slow connections.</p>
    </div>
    <div id="pane-conv" class="pane">
      <div class="toolbar">
        <button id="btn-scan-conv" class="btn btn-sm"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15 L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Scan</button>
        <div class="sel-actions">
          <button id="btn-all-conv" class="icon-text-btn" title="Select all"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 12 L11 16 L17 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> All</button>
          <span class="sep">·</span>
          <button id="btn-none-conv" class="icon-text-btn" title="Select none"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8 L16 16 M16 8 L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> None</button>
        </div>
        <span id="count-conv" class="count"></span>
      </div>
      <div id="conv-list" class="item-list"><p class="placeholder">Click Scan to load your conversations.</p></div>
      <div class="action-bar">
        <button id="btn-del-sel-conv" class="btn btn-danger" disabled><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7 H20 M9 7 V4 H15 V7 M10 11 V17 M14 11 V17 M5 7 L6 20 H18 L19 7 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Delete selected</button>
        <button id="btn-del-all-conv" class="btn btn-ghost" title="Delete all"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7 H20 M9 7 V4 H15 V7 M10 11 V17 M14 11 V17 M5 7 L6 20 H18 L19 7 Z" fill="none" stroke="currentColor" stroke-width="2"/></svg> Delete all</button>
      </div>
    </div>
    <div id="pane-lib" class="pane hidden">
      <div class="toolbar">
        <button id="btn-scan-lib" class="btn btn-sm"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15 L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Scan</button>
        <div class="sel-actions">
          <button id="btn-all-lib" class="icon-text-btn"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 12 L11 16 L17 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> All</button>
          <span class="sep">·</span>
          <button id="btn-none-lib" class="icon-text-btn"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8 L16 16 M16 8 L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> None</button>
        </div>
        <span id="count-lib" class="count"></span>
      </div>
      <div id="lib-list" class="item-list"><p class="placeholder">Go to Gemini Library then click Scan.</p></div>
      <div class="action-bar">
        <button id="btn-del-sel-lib" class="btn btn-danger" disabled><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7 H20 M9 7 V4 H15 V7 M10 11 V17 M14 11 V17 M5 7 L6 20 H18 L19 7 Z" fill="none" stroke="currentColor" stroke-width="2"/></svg> Delete selected</button>
        <button id="btn-del-all-lib" class="btn btn-ghost"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7 H20 M9 7 V4 H15 V7 M10 11 V17 M14 11 V17 M5 7 L6 20 H18 L19 7 Z" fill="none" stroke="currentColor" stroke-width="2"/></svg> Delete all</button>
      </div>
    </div>
    <div id="status-bar" class="status-bar hidden"></div>
    <button id="btn-stop" class="btn btn-stop hidden">■ Stop</button>
  </div>
</div>
<footer><a href="https://github.com/systemdio/gemini-wiper" target="_blank">GitHub</a><span class="sep">·</span><span id="ver"></span></footer>
<script src="popup.js"></script></body></html>
